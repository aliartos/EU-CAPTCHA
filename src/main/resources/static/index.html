<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EU CAPTCHA Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #004494;
            text-align: center;
        }
        .captcha-container {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
        }
        .captcha-image-container {
            text-align: center;
            margin-bottom: 15px;
        }
        img#captcha-image {
            max-width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        .checkbox-group label {
            margin-right: 10px;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button#reload-button {
            background-color: #f0ad4e;
            color: white;
        }
        button#submit-button {
            background-color: #5cb85c;
            color: white;
        }
        .message {
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            display: none;
        }
        #success-message {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
        #error-message {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
        .audio-container {
            margin-top: 15px;
            text-align: center;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        .tab {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            border-bottom: none;
            margin-right: 5px;
            border-radius: 5px 5px 0 0;
        }
        .tab.active {
            background-color: #fff;
            border-bottom: 1px solid #fff;
            margin-bottom: -1px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EU CAPTCHA Demo</h1>
        
        <div class="tabs">
            <div class="tab active" data-tab="standard">Standard CAPTCHA</div>
            <div class="tab" data-tab="rotate">Rotation CAPTCHA</div>
        </div>
        
        <div id="standard-tab" class="tab-content active">
            <p>This demo showcases the EU CAPTCHA standard alphanumeric CAPTCHA with audio transcription.</p>
            
            <div class="form-group">
                <label for="language-select">Select Language:</label>
                <select id="language-select">
                    <option value="en-GB">English</option>
                    <option value="fr-FR">Français</option>
                    <option value="de-DE">Deutsch</option>
                    <option value="bg-BG">български</option>
                    <option value="hr-HR">Hrvatski</option>
                    <option value="da-DK">Dansk</option>
                    <option value="es-ES">Español</option>
                    <option value="et-EE">Eesti keel</option>
                    <option value="fi-FI">Suomi</option>
                    <option value="el-GR">ελληνικά</option>
                    <option value="hu-HU">Magyar</option>
                    <option value="it-IT">Italiano</option>
                    <option value="lv-LV">Latviešu valoda</option>
                    <option value="lt-LT">Lietuvių kalba</option>
                    <option value="mt-MT">Malti</option>
                    <option value="nl-NL">Nederlands</option>
                    <option value="pl-PL">Polski</option>
                    <option value="pt-PT">Português</option>
                    <option value="ro-RO">Română</option>
                    <option value="sk-SK">Slovenčina</option>
                    <option value="sl-SI">Slovenščina</option>
                    <option value="sv-SE">Svenska</option>
                    <option value="cs-CZ">čeština</option>
                    <option value="ga-IE">Gaeilge</option>
                </select>
            </div>
            
            <div class="form-group checkbox-group">
                <label for="capitalized">Capitalized:</label>
                <input type="checkbox" id="capitalized" checked>
            </div>
            
            <div class="captcha-container">
                <div class="captcha-image-container">
                    <img id="captcha-image" alt="CAPTCHA Image" src="" captchaId="">
                </div>
                
                <div class="audio-container">
                    <audio id="audio-captcha" controls src=""></audio>
                </div>
                
                <div class="form-group">
                    <label for="captcha-answer">Enter CAPTCHA:</label>
                    <input type="text" id="captcha-answer" placeholder="Type the characters you see in the image">
                </div>
                
                <div class="button-group">
                    <button id="reload-button">Reload CAPTCHA</button>
                    <button id="submit-button">Submit</button>
                </div>
                
                <div id="success-message" class="message">
                    CAPTCHA validation successful!
                </div>
                
                <div id="error-message" class="message">
                    CAPTCHA validation failed. Please try again.
                </div>
            </div>
        </div>
        
        <div id="rotate-tab" class="tab-content">
            <p>The rotation CAPTCHA functionality will be implemented in a future update.</p>
        </div>
    </div>
    
    <script src="captcha-demo.js"></script>
    <script>
        // Tab functionality
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and tab contents
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding content
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
            });
        });
    </script>
</body>
</html>
