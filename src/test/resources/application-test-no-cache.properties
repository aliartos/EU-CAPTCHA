# ====================================
# = TEST CONFIGURATION WITH NO CACHING
# ====================================
# Set active profile to test
spring.profiles.active=test
# Disable caching completely for this test profile
cache.type=none

# Redis configuration for testing (not used with cache.type=none)
cache.redis.host=localhost
cache.redis.port=6379
cache.redis.password=

# Disable actual connections to external services
spring.main.allow-bean-definition-overriding=true

# ==================================================================================================
# = AWS CONFIG properties:
# ==================================================================================================
# Disable AWS integrations for tests
aws.enabled=false
# Disable AWS S3 integration for tests
aws.s3.enabled=false
# AWS S3 bucket names (not used in tests)
aws.s3.bucket.name=test-bucket
aws.s3.log.bucket.name=test-log-bucket
# AWS S3 region (not used in tests)
aws.s3.region=EU_WEST_1