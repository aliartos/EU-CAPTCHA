# ====================================
# =   EU CAPTCHA DATA SOURCE
# ====================================
# ====================================
# = SERVER APPLICATION
# ====================================
server.port = 8080
# Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly.
server.servlet.encoding.charset=UTF-8
# Enable http encoding support.
server.servlet.encoding.enabled=true
# Force the encoding to the configured charset on HTTP requests and responses.
server.servlet.encoding.force=true

spring.main.allow-bean-definition-overriding=true

# ==================================================================================================
# = APP & WEB CONFIG properties:
# ==================================================================================================
config.view.prefix=/WEB-INF/pages/
config.view.suffix=.jsp
config.view.defaultLocale=en-GB
config.view.defaultEncoding=UTF-8
config.view.baseName=messages
config.view.paramName=lang
config.view.cssHandler=css/**
config.view.cssLocations=/WEB-INF/pages/css/
config.view.jsHandler=js/**
config.view.jsLocations=/WEB-INF/pages/js/

# ==================================================================================================
# = CACHE CONFIG properties:
# ==================================================================================================
# Cache type: memcached or redis
cache.type=redis

# Memcached configuration
cache.memcached.host=AWS host and port
cache.memcached.hostname=AWS hostname

# Redis configuration
cache.redis.host=localhost
cache.redis.port=6379
cache.redis.password=

# ==================================================================================================
# = AWS CONFIG properties:
# ==================================================================================================
# Master switch for all AWS integrations
aws.enabled=false
# Enable/disable AWS S3 integration (only effective if aws.enabled=true)
aws.s3.enabled=false
# AWS S3 bucket names
aws.s3.bucket.name=bucket name to get and write to
aws.s3.log.bucket.name=bucket name for log files
# AWS S3 region
aws.s3.region=EU_WEST_1

# ==================================================================================================
# = Controller properties:
# ==================================================================================================
controller.captcha.welcome = WELCOME
controller.captcha.textualCaptcha = EUCAPTCHA
controller.captcha.rotationalCaptcha = EUCAPTCHAROTATE
controller.captcha.slidingCaptcha = EUCAPTCHASLIDING

# ==================================================================================================
# = Sound properties:
# ==================================================================================================
sound.noises.default = /sounds/noises/radio_tuning.wav,/sounds/noises/restaurant.wav,/sounds/noises/swimming.wav,/sounds/noises/zombie.wav
sound.noises.samplevolume= 0.5D
sound.noises.noisevolume = 0.01D
sound.noises.silence.audio= /sounds/silence/silence1s.wav
